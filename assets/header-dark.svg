<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" fill="none">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1200" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#13223D"/>
      <stop offset="100%" stop-color="#1B3664"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#78BB3C"/>
      <stop offset="55%" stop-color="#8ED151"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="clip-dark">
      <rect width="1200" height="290" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-dark)">
    <rect width="1200" height="290" fill="url(#bg-dark)"/>
    <rect width="1200" height="290" fill="url(#grid-dark)"/>
    <rect x="0" y="285" width="1200" height="5" fill="url(#accent-line)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="288.5" rx="15.25" stroke="#30363D" stroke-width="1.5"/>

  <!-- Subtle architectural accent mark on the right -->
  <g opacity="0.22" transform="translate(955, 42)">
    <rect x="0" y="0" width="185" height="185" rx="20" stroke="#8ED151" stroke-width="1.5" fill="none"/>
    <rect x="24" y="24" width="137" height="137" rx="14" stroke="#93C5FD" stroke-width="1.25" fill="none"/>
    <path d="M58 68 L127 68 M92.5 68 L92.5 130" stroke="#8ED151" stroke-width="6" stroke-linecap="round"/>
    <circle cx="130" cy="126" r="7" fill="#8ED151"/>
  </g>

  <!-- Eyebrow pill -->
  <rect x="56" y="44" width="420" height="30" rx="15" fill="#78BB3C" fill-opacity="0.14" stroke="#78BB3C" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="74" cy="59" r="4.5" fill="#8ED151"/>
  <text x="88" y="64" fill="#B7F084" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="1.2">FOUNDER &amp; PRINCIPAL ENGINEER · THREADCODE</text>

  <!-- Name -->
  <text x="56" y="132" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8">Augusto Linhares</text>

  <!-- Subtitle -->
  <text x="56" y="172" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="500">Mobile Architecture (React Native) · Desktop (Tauri / Rust) · Web &amp; AI Systems</text>

  <!-- Divider -->
  <line x1="56" y1="204" x2="880" y2="204" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Bottom KPI / metadata row -->
  <text x="56" y="242" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="600">
    <tspan fill="#8ED151">15+ yrs</tspan><tspan> engineering</tspan>
    <tspan fill="#475569">   ·   </tspan>
    <tspan fill="#8ED151">8+ yrs</tspan><tspan> React Native</tspan>
    <tspan fill="#475569">   ·   </tspan>
    <tspan fill="#8ED151">10+</tspan><tspan> live products</tspan>
    <tspan fill="#475569">   ·   </tspan>
    <tspan fill="#E2E8F0">threadcode.com.br</tspan>
  </text>
</svg>
